# Monitor config
monitor=,preferred,auto,1.25

# Execute your favorite apps at launch
exec-once = swww-daemon && ~/.local/bin/wall.sh init
exec-once = swaync
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun
$browser = google-chrome-stable # или firefox, у тебя оба есть
$scripts = ~/.config/waybar/scripts

# Input config
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle # Переключение по Win+Space как ты просил
    follow_mouse = 1

    touchpad {
        natural_scroll = yes # Инвертированная прокрутка, как ты хотел
        scroll_factor = 0.85 # Начнем с 1.0, чтобы прочувствовать. Если будет слишком быстро, уменьшим.
    }

    sensitivity = 0
}

# General config
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(d33637) rgb(611a1c) 45deg
    col.inactive_border = rgb(351212)
    layout = dwindle
}

misc {
    force_default_wallpaper = 0 # Disable the anime girl / default wallpaper
    disable_hyprland_logo = true # Disable the splash logo
}

# Decoration config
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(0c0c0cee)
    }
}

# Animations
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layouts
dwindle {
    pseudotile = yes
    preserve_split = yes
}

# --- KEYBINDINGS ---
$mainMod = SUPER # Теперь это Win

# Базовые действия
bind = $mainMod, Return, exec, $terminal       # Win + Enter
bind = $mainMod, Q, killactive,                # Win + Q
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, exec, Telegram      # Win + T (Telegram)
bind = $mainMod SHIFT, T, togglefloating,      # Win + Shift + T (Тайлинг/Обычное)
bind = $mainMod, R, exec, $menu
bind = $mainMod, F, fullscreen,                # Win + F (Fullscreen)
bind = $mainMod, code:51, exec, hyprlock              # Win + \
bind = $mainMod, S, exec, spotify              # Win + S (Spotify)
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy # Win + Shift + S (Скриншот в буфер)
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy # Win + V (Буфер обмена)
bind = $mainMod, B, exec, $browser              # Win + B (Браузер)
bind = $mainMod SHIFT, P, exec, ~/.local/bin/wall.sh pick

# Vim-style фокус окон (Win + H/J/K/L)
bind = $mainMod, code:43, movefocus, l # H
bind = $mainMod, code:46, movefocus, r # L
bind = $mainMod, code:44, movefocus, d # J
bind = $mainMod, code:45, movefocus, u # K

# Ресайз окон (Ctrl + Alt + H/J/K/L)
binde = CTRL ALT, code:43, resizeactive, -20 0
binde = CTRL ALT, code:46, resizeactive, 20 0
binde = CTRL ALT, code:44, resizeactive, 0 20
binde = CTRL ALT, code:45, resizeactive, 0 -20

# Переключение воркспейсов
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Смена воркспейсов по порядку (Win + Shift + H/L)
bind = $mainMod SHIFT, code:43, workspace, e-1 # H
bind = $mainMod SHIFT, code:46, workspace, e+1 # L

# Перенос активного окна на воркспейс (Win + Shift + 1-9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Управление мультимедиа через скрипты Mechabar
bindel = , XF86AudioRaiseVolume, exec, $scripts/volume.sh output raise 5
bindel = , XF86AudioLowerVolume, exec, $scripts/volume.sh output lower 5
bindl  = , XF86AudioMute, exec, $scripts/volume.sh output mute
bindel = , XF86MonBrightnessUp, exec, $scripts/backlight.sh up 5
bindel = , XF86MonBrightnessDown, exec, $scripts/backlight.sh down 5

# Альтернативные бинды (Win + F-клавиши) на случай, если Fn не работает
bindel = $mainMod, F3, exec, $scripts/volume.sh output raise 5
bindel = $mainMod, F2, exec, $scripts/volume.sh output lower 5
bindl  = $mainMod, F1, exec, $scripts/volume.sh output mute
bindel = $mainMod, F6, exec, $scripts/backlight.sh up 5
bindel = $mainMod, F5, exec, $scripts/backlight.sh down 5

# Мышь
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
