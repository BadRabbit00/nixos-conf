general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/.config/swww/wall.png   # Твои инфернальные обои
    color = rgba(12, 12, 12, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.5 # Затемним, чтобы часы горели ярче
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Часы (Время)
label {
    monitor =
    text = $TIME
    color = rgb(211, 54, 55) # Твой яркий красный #d33637
    font_size = 120
    font_family = SpaceMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
}

# Дата
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = rgb(172, 126, 124) # Твой пыльно-розовый #ac7e7c
    font_size = 25
    font_family = SpaceMono Nerd Font
    position = 0, -10
    halign = center
    valign = center
}

# Поле ввода
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(53, 18, 18) # Твой #351212
    inner_color = rgb(12, 12, 12) # Твой #0c0c0c
    font_color = rgb(172, 126, 124) # Твой #ac7e7c
    fade_on_empty = false
    placeholder_text = <span foreground="##ac7e7c"><i>Password...</i></span>
    hide_input = false
    check_color = rgb(211, 54, 55)
    fail_color = rgb(211, 54, 55)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(211, 54, 55)
    position = 0, -120
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text =   $USER
    color = rgb(172, 126, 124)
    font_size = 20
    font_family = SpaceMono Nerd Font
    position = 0, -190
    halign = center
    valign = center
}
