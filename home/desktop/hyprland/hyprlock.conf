general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    color = rgb(12, 12, 12) # Чистая бездна #0c0c0c
}

# Лого (Кровавый кролик)
image {
    monitor =
    path = ~/OneDrive/Documents/Project/nixos-conf/home/programs/logo.png
    size = 200
    rounding = -1 # Оставляем как есть
    border_size = 0
    position = 0, 200
    halign = center
    valign = center
}

# Часы (Время)
label {
    monitor =
    text = $TIME
    color = rgb(211, 54, 55) # Кровавый красный #d33637
    font_size = 90
    font_family = SpaceMono Nerd Font Bold
    position = 0, 20
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %d %B")"
    color = rgb(172, 126, 124) # Твой пыльно-розовый #ac7e7c
    font_size = 20
    font_family = SpaceMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Поле ввода
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(53, 18, 18) # Тёмный бордо #351212
    inner_color = rgb(12, 12, 12) # Бездна #0c0c0c
    font_color = rgb(172, 126, 124) # Текст #ac7e7c
    fade_on_empty = true
    placeholder_text = <i>Locked for the Architect...</i>
    hide_input = false
    check_color = rgb(211, 54, 55)
    fail_color = rgb(211, 54, 55)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(211, 54, 55)
    position = 0, -120
    halign = center
    valign = center
}
