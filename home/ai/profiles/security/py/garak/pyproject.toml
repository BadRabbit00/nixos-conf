[project]
name = "agy-sec-garak"
version = "0"
# 3.14 — как python3 в nixpkgs: torch подставляется оттуда (CUDA или CPU),
# колесо torch из PyPI в venv не попадает (см. ../default.nix, nixpkgsPrebuilt).
requires-python = ">=3.14,<3.15"
dependencies = ["garak==0.17.1"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
